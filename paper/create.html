<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>paper — write</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="paper.css">
<style>
  .page {
    max-width: 1240px; margin: 0 auto;
    padding: 40px 48px 120px;
  }
  @media (max-width: 900px) { .page { padding: 24px 24px 100px; } }

  .composer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0 28px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 40px;
  }
  .composer-head h1 { margin: 0; font-size: 28px; font-weight: 400; letter-spacing: -0.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .composer-head .status { flex-shrink: 0; }
  .composer-head .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .composer-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .composer-head .dot.saved { background: #4C9A6A; }
  .composer-head .dot.dirty { background: var(--warm); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .kind-toggle { display: inline-flex; align-self: flex-start; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
  .kind-toggle button { padding: 6px 16px; border-radius: 999px; font-size: 13px; color: var(--ink-2); letter-spacing: -0.005em; transition: all .2s ease; }
  .kind-toggle button.on { background: var(--ink); color: var(--paper); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
  }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; gap: 32px; } }

  .editor { display: flex; flex-direction: column; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
  .field input, .field textarea {
    background: transparent; border: 0;
    border-bottom: 1px solid var(--rule);
    padding: 10px 0;
    font-family: var(--sans);
    outline: 0;
    color: var(--ink);
    transition: border-color .2s ease;
    resize: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--ink); }
  .field input.title { font-size: clamp(26px, 3vw, 34px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.1; }
  .field input.deck-in { font-size: 17px; font-weight: 400; letter-spacing: -0.01em; color: var(--ink-2); }
  .field input.small, .field textarea.small { font-size: 15px; letter-spacing: -0.005em; }
  .field textarea.body { min-height: 420px; font-size: 15px; line-height: 1.65; letter-spacing: -0.005em; font-feature-settings: "ss01"; border-bottom: 0; border: 1px solid var(--rule); border-radius: 8px; padding: 16px; background: color-mix(in oklab, var(--ink) 2%, var(--paper)); }
  .field textarea.body:focus { border-color: var(--ink); }
  .field .hint { font-size: 12px; color: var(--muted); }
  .field .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 560px) { .field .row { grid-template-columns: 1fr; } }

  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 0 0;
  }
  .toolbar button {
    padding: 5px 11px; border-radius: 8px; font-size: 12.5px;
    color: var(--ink-2); border: 1px solid var(--rule); letter-spacing: -0.005em;
    transition: all .15s ease;
  }
  .toolbar button:hover { color: var(--ink); border-color: var(--ink-2); }
  .toolbar .sep { width: 1px; height: 16px; background: var(--rule); margin: 0 4px; }
  .toolbar .hint { margin-left: auto; font-size: 12px; color: var(--muted); }

  .actions-row {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 24px; margin-top: 8px;
    border-top: 1px solid var(--rule);
    gap: 12px; flex-wrap: wrap;
  }
  .actions-row .left, .actions-row .right { display: flex; gap: 10px; align-items: center; }
  .btn {
    padding: 9px 18px; border-radius: 999px;
    font-size: 13px; letter-spacing: -0.005em;
    border: 1px solid var(--rule); color: var(--ink-2);
    transition: all .2s ease;
  }
  .btn:hover { color: var(--ink); border-color: var(--ink-2); }
  .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.primary:hover { opacity: .88; }
  .btn.danger:hover { color: var(--warm); border-color: var(--warm); }

  /* preview */
  .preview { position: sticky; top: 40px; align-self: start; }
  .preview .p-label {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0 0 14px; border-bottom: 1px solid var(--rule); margin-bottom: 32px;
    font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 500;
  }
  .preview .p-label .tag { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--muted); }
  .p-kind {
    font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
    margin-bottom: 18px;
  }
  .p-kind::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: middle; translate: 0 -1px; }
  .p-title { margin: 0 0 16px; font-size: clamp(28px, 3.2vw, 40px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.04; text-wrap: balance; }
  .p-title.empty { color: var(--muted); }
  .p-deck { font-size: 17px; line-height: 1.45; color: var(--ink-2); letter-spacing: -0.01em; margin: 0 0 28px; font-weight: 400; max-width: 36ch; }
  .p-byline { display: flex; gap: 14px; font-size: 13px; color: var(--muted); padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 32px; }
  .p-byline b { color: var(--ink); font-weight: 500; }
  .p-body { font-size: 15px; line-height: 1.65; color: var(--ink); letter-spacing: -0.005em; }
  .p-body p { margin: 0 0 1em; }
  .p-body h2 { font-size: 19px; font-weight: 500; letter-spacing: -0.015em; margin: 28px 0 10px; }
  .p-body blockquote { margin: 20px 0; font-size: 18px; font-weight: 400; letter-spacing: -0.01em; color: var(--ink); line-height: 1.3; }
  .p-body blockquote::before { content: "“"; color: var(--accent); margin-right: 4px; }
  .p-body:empty::before { content: "Your essay will preview here. Use two blank lines for paragraphs, ## for headings, > for quotes, **bold** and *italic*."; color: var(--muted); font-style: italic; }

  .tag-chips { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 6px; }
  .tag-chips .tc { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); font-size: 12px; color: var(--ink-2); letter-spacing: -0.005em; display: inline-flex; align-items: center; gap: 6px; }
  .tag-chips .tc button { color: var(--muted); font-size: 14px; line-height: 1; }
  .tag-chips .tc button:hover { color: var(--warm); }

  /* drafts panel */
  .drafts {
    margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule);
  }
  .drafts h3 { margin: 0 0 16px; font-size: 13px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
  .drafts ul { list-style: none; padding: 0; margin: 0; }
  .drafts li { border-bottom: 1px solid var(--rule); }
  .drafts li a { display: grid; grid-template-columns: 70px 1fr 80px 80px; gap: 18px; padding: 14px 0; align-items: baseline; font-size: 14px; }
  .drafts li a:hover { background: color-mix(in oklab, var(--ink) 2%, var(--paper)); padding-left: 8px; padding-right: 8px; }
  .drafts .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .drafts .t { color: var(--ink); letter-spacing: -0.01em; }
  .drafts .d { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .drafts .x { text-align: right; color: var(--muted); font-size: 12px; }

  /* upload zone */
  .upload {
    border: 1px dashed var(--rule);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px; color: var(--muted);
    text-align: center;
    transition: all .2s ease;
    cursor: pointer;
  }
  .upload.over { border-color: var(--ink); color: var(--ink); background: color-mix(in oklab, var(--ink) 3%, var(--paper)); }
  .upload input { display: none; }
  .upload b { color: var(--ink); font-weight: 500; }

  .helper-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px; }
  @media (max-width: 560px) { .helper-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body data-theme="light" data-accent="ink">

<div class="shell">
  <nav class="top">
    <a href="index.html" class="brand"><span class="dot"></span>paper</a>
    <div class="links">
      <a href="index.html">Index</a>
      <a href="index.html#essays-col">Essays</a>
      <a href="index.html#articles-col">Articles</a>
      <a href="create.html" class="active">Write</a>
    </div>
    <div class="actions">
      <button id="btn-theme" aria-label="Theme"></button>
    </div>
  </nav>
</div>

<main class="page">
  <div class="composer-head">
    <h1 id="title-head">New piece</h1>
    <div class="status"><span class="dot" id="save-dot"></span><span id="save-text">Unsaved draft</span></div>
  </div>

  <div class="grid">
    <!-- editor -->
    <section class="editor">
      <div class="field">
        <label>Kind</label>
        <div class="kind-toggle" id="kind">
          <button data-v="essay" class="on">Essay</button>
          <button data-v="article">Article</button>
        </div>
        <span class="hint" id="kind-hint">A long-form argument. No length cap. Published when you're ready.</span>
      </div>

      <div class="field">
        <label>Title</label>
        <input class="title" id="f-title" placeholder="A title, in sentence case." />
      </div>

      <div class="field">
        <label>Deck <span style="opacity:.6;text-transform:none;letter-spacing:0;font-weight:400">(one or two sentences)</span></label>
        <input class="deck-in" id="f-deck" placeholder="The short summary that sits under the title." />
      </div>

      <div class="helper-grid">
        <div class="field">
          <label>Author</label>
          <input class="small" id="f-author" placeholder="Your name" />
        </div>
        <div class="field">
          <label>Date</label>
          <input class="small" id="f-date" type="date" />
        </div>
      </div>

      <div class="field">
        <label>Tags</label>
        <input class="small" id="f-tags-input" placeholder="Type a tag and press enter…" />
        <div class="tag-chips" id="tag-chips"></div>
      </div>

      <div class="field">
        <label>Body</label>
        <div class="toolbar">
          <button data-ins="## ">H2</button>
          <button data-ins="**" data-wrap="**">Bold</button>
          <button data-ins="*" data-wrap="*">Italic</button>
          <button data-ins="> ">Quote</button>
          <span class="sep"></span>
          <button id="ins-break">¶ break</button>
          <span class="hint">Markdown: ## heading · &gt; quote · **bold** · *italic*</span>
        </div>
        <textarea class="body" id="f-body" placeholder="Start writing. Use two newlines to separate paragraphs."></textarea>
        <label class="upload" id="upload">
          <input type="file" id="file-input" accept=".md,.txt,.markdown,text/plain,text/markdown" />
          <span><b>Upload</b> a .md or .txt — drop it here, or click to browse</span>
        </label>
      </div>

      <div class="actions-row">
        <div class="left">
          <button class="btn" id="btn-reset">Discard</button>
          <button class="btn danger" id="btn-delete" style="display:none">Delete</button>
        </div>
        <div class="right">
          <button class="btn" id="btn-save">Save draft</button>
          <button class="btn primary" id="btn-publish">Publish →</button>
        </div>
      </div>
    </section>

    <!-- preview -->
    <aside class="preview">
      <div class="p-label">
        <span>Preview</span>
        <span class="tag" id="p-stats">0 words · 0 min</span>
      </div>
      <div class="p-kind" id="p-kind">Essay</div>
      <h1 class="p-title empty" id="p-title">Untitled</h1>
      <p class="p-deck" id="p-deck"></p>
      <div class="p-byline"><span><b id="p-author">—</b></span><span id="p-date">—</span></div>
      <div class="p-body" id="p-body"></div>
    </aside>
  </div>

  <!-- drafts list -->
  <section class="drafts">
    <h3>Your pieces</h3>
    <ul id="drafts-list"></ul>
  </section>
</main>

<div class="tweaks" id="tweaks">
  <h6>Tweaks <button class="x" id="tweaks-close">×</button></h6>
  <div class="row"><span>Theme</span><div class="opts" data-k="theme">
    <button data-v="light">Light</button><button data-v="dark">Dark</button>
  </div></div>
  <div class="row"><span>Accent</span><div class="opts" data-k="accent">
    <button data-v="ink">Ink</button><button data-v="warm">Warm</button>
  </div></div>
</div>

<div class="toast" id="toast">Saved</div>

<script src="data.js"></script>
<script>
/*EDITMODE-BEGIN*/const TWEAKS = {
  "theme": "light",
  "accent": "ink"
}/*EDITMODE-END*/;
try { const t = JSON.parse(localStorage.getItem('paper:tweaks')||'null'); if (t) Object.assign(TWEAKS, t); } catch(e){}
Object.entries(TWEAKS).forEach(([k,v]) => document.body.setAttribute('data-'+k, v));

const params = new URLSearchParams(location.search);
const editId = params.get('edit');
let existing = editId ? DB.get(editId) : null;

const DRAFT_KEY = 'paper:draft:v1';
let state = existing ? {
  kind: existing.kind, title: existing.title, deck: existing.deck || '',
  author: existing.author, date: existing.date,
  tags: (existing.tags || []).slice(),
  body: existing.body || ''
} : loadDraft() || {
  kind: 'essay', title: '', deck: '',
  author: '', date: new Date().toISOString().slice(0,10),
  tags: [], body: ''
};

let saved = false;
function markDirty() {
  saved = false;
  document.getElementById('save-dot').className = 'dot dirty';
  document.getElementById('save-text').textContent = 'Unsaved changes';
}
function markSaved(msg = 'Draft saved locally') {
  saved = true;
  document.getElementById('save-dot').className = 'dot saved';
  document.getElementById('save-text').textContent = msg;
}

function $(id) { return document.getElementById(id); }
function escapeHtml(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function syncFromState() {
  $('f-title').value = state.title;
  $('f-deck').value = state.deck;
  $('f-author').value = state.author;
  $('f-date').value = state.date;
  $('f-body').value = state.body;
  document.querySelectorAll('#kind button').forEach(b => b.classList.toggle('on', b.dataset.v === state.kind));
  $('kind-hint').textContent = state.kind === 'essay'
    ? 'A long-form argument. No length cap. Published when you are ready.'
    : 'A short dispatch. Timely, dated, and lighter on scaffolding.';
  $('title-head').textContent = existing ? 'Editing — ' + (state.title || 'untitled') : 'New piece';
  renderTagChips();
  renderPreview();
}

function renderTagChips() {
  $('tag-chips').innerHTML = state.tags.map((t,i) =>
    `<span class="tc">${escapeHtml(t)}<button data-i="${i}" aria-label="Remove">×</button></span>`).join('');
  document.querySelectorAll('#tag-chips button').forEach(b => b.onclick = () => {
    state.tags.splice(Number(b.dataset.i), 1); renderTagChips(); markDirty(); saveDraft();
  });
}

function renderPreview() {
  $('p-kind').textContent = (state.kind === 'essay' ? 'Essay' : 'Article') + ' · ' + readTime(state.body);
  const titleEl = $('p-title');
  titleEl.textContent = state.title || 'Untitled';
  titleEl.classList.toggle('empty', !state.title);
  $('p-deck').textContent = state.deck;
  $('p-author').textContent = state.author || '—';
  $('p-date').textContent = state.date ? fmtDate(state.date) : '—';
  const { html } = renderMarkdown(state.body);
  $('p-body').innerHTML = html;
  const words = (state.body||'').trim().split(/\s+/).filter(Boolean).length;
  $('p-stats').textContent = `${words.toLocaleString()} words · ${readTime(state.body)}`;
}

/* bindings */
$('f-title').addEventListener('input', e => { state.title = e.target.value; markDirty(); saveDraft(); $('title-head').textContent = existing ? 'Editing — ' + (state.title || 'untitled') : 'New piece'; renderPreview(); });
$('f-deck').addEventListener('input', e => { state.deck = e.target.value; markDirty(); saveDraft(); renderPreview(); });
$('f-author').addEventListener('input', e => { state.author = e.target.value; markDirty(); saveDraft(); renderPreview(); });
$('f-date').addEventListener('input', e => { state.date = e.target.value; markDirty(); saveDraft(); renderPreview(); });
$('f-body').addEventListener('input', e => { state.body = e.target.value; markDirty(); saveDraft(); renderPreview(); });

document.querySelectorAll('#kind button').forEach(b => b.onclick = () => {
  state.kind = b.dataset.v;
  document.querySelectorAll('#kind button').forEach(x => x.classList.toggle('on', x === b));
  $('kind-hint').textContent = state.kind === 'essay'
    ? 'A long-form argument. No length cap. Published when you are ready.'
    : 'A short dispatch. Timely, dated, and lighter on scaffolding.';
  renderPreview(); markDirty(); saveDraft();
});

// tag input
$('f-tags-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const v = e.target.value.trim().toLowerCase().replace(/,/g,'');
    if (v && !state.tags.includes(v)) { state.tags.push(v); renderTagChips(); markDirty(); saveDraft(); }
    e.target.value = '';
  }
});

// toolbar
document.querySelectorAll('.toolbar [data-ins]').forEach(b => b.addEventListener('click', () => {
  const ta = $('f-body'); const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const ins = b.dataset.ins; const wrap = b.dataset.wrap;
  let replacement;
  if (wrap) replacement = ins + (sel || 'text') + wrap;
  else replacement = (s > 0 && ta.value[s-1] !== '\n' ? '\n\n' : '') + ins + sel;
  ta.setRangeText(replacement, s, e, 'end');
  ta.focus();
  ta.dispatchEvent(new Event('input'));
}));
$('ins-break').onclick = () => {
  const ta = $('f-body');
  ta.setRangeText('\n\n', ta.selectionStart, ta.selectionEnd, 'end');
  ta.focus(); ta.dispatchEvent(new Event('input'));
};

// upload
const upload = $('upload');
const fileInput = $('file-input');
['dragenter','dragover'].forEach(ev => upload.addEventListener(ev, e => { e.preventDefault(); upload.classList.add('over'); }));
['dragleave','drop'].forEach(ev => upload.addEventListener(ev, e => { e.preventDefault(); upload.classList.remove('over'); }));
upload.addEventListener('drop', e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
function handleFile(file) {
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result || '');
    const parsed = parseFrontmatter(text);
    if (parsed.title && !state.title) state.title = parsed.title;
    if (parsed.deck && !state.deck) state.deck = parsed.deck;
    if (parsed.author && !state.author) state.author = parsed.author;
    if (parsed.date) state.date = parsed.date;
    if (parsed.kind) state.kind = parsed.kind;
    if (parsed.tags && parsed.tags.length) state.tags = [...new Set([...state.tags, ...parsed.tags])];
    // take h1 from body as title if still missing
    const lines = parsed.body.split('\n');
    if (!state.title) {
      const h1 = lines.find(l => /^#\s+/.test(l));
      if (h1) { state.title = h1.replace(/^#\s+/, '').trim(); parsed.body = parsed.body.replace(h1, '').trim(); }
    }
    state.body = parsed.body;
    syncFromState(); markDirty(); saveDraft();
    toast('Imported "' + file.name + '"');
  };
  r.readAsText(file);
}
function parseFrontmatter(txt) {
  const m = txt.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!m) return { body: txt };
  const fm = {}; const body = m[2];
  m[1].split('\n').forEach(line => {
    const mm = line.match(/^([A-Za-z_][\w-]*)\s*:\s*(.*)$/);
    if (!mm) return;
    let v = mm[2].trim();
    if (/^\[.*\]$/.test(v)) v = v.slice(1,-1).split(',').map(s=>s.trim().replace(/^['"]|['"]$/g,'')).filter(Boolean);
    else v = v.replace(/^['"]|['"]$/g,'');
    fm[mm[1].toLowerCase()] = v;
  });
  return { title: fm.title, deck: fm.deck || fm.description, author: fm.author, date: fm.date, kind: fm.kind, tags: Array.isArray(fm.tags) ? fm.tags : (fm.tags ? [fm.tags] : []), body };
}

// save / publish
function saveDraft() { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }
function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch(e){ return null; } }
function clearDraft() { localStorage.removeItem(DRAFT_KEY); }

$('btn-save').onclick = () => { saveDraft(); markSaved(); toast('Draft saved'); };
$('btn-reset').onclick = () => {
  if (confirm('Discard the current draft?')) {
    clearDraft();
    state = { kind: 'essay', title: '', deck: '', author: '', date: new Date().toISOString().slice(0,10), tags: [], body: '' };
    existing = null;
    history.replaceState(null, '', 'create.html');
    syncFromState();
    markSaved('Draft cleared');
  }
};
$('btn-publish').onclick = () => {
  if (!state.title.trim()) { toast('Give it a title first'); $('f-title').focus(); return; }
  if (!state.author.trim()) { toast('Add an author'); $('f-author').focus(); return; }
  if (!state.body.trim()) { toast('The body is empty'); $('f-body').focus(); return; }
  const payload = {
    id: existing ? existing.id : genId(),
    kind: state.kind,
    title: state.title.trim(),
    deck: state.deck.trim(),
    author: state.author.trim(),
    date: state.date || new Date().toISOString().slice(0,10),
    tags: state.tags,
    body: state.body
  };
  if (existing) { DB.update(existing.id, payload); toast('Updated'); }
  else { DB.add(payload); toast('Published'); }
  clearDraft();
  setTimeout(() => { location.href = 'read.html?id=' + encodeURIComponent(payload.id); }, 500);
};

$('btn-delete').onclick = () => {
  if (!existing) return;
  if (confirm('Delete this ' + existing.kind + '? This cannot be undone.')) {
    DB.remove(existing.id); clearDraft(); location.href = 'index.html';
  }
};
if (existing) { $('btn-delete').style.display = ''; }

/* drafts list */
function renderDrafts() {
  const own = DB.all().filter(p => !p.id.startsWith('seed-'));
  const ul = $('drafts-list');
  if (own.length === 0) {
    ul.innerHTML = `<li style="padding:16px 0;color:var(--muted);font-size:14px;">Nothing published yet. Write something above and press <b style="color:var(--ink)">Publish</b>.</li>`;
    return;
  }
  ul.innerHTML = own.map(p => `
    <li><a href="read.html?id=${encodeURIComponent(p.id)}">
      <span class="k">${p.kind}</span>
      <span class="t">${escapeHtml(p.title)}</span>
      <span class="d">${fmtDateDot(p.date)}</span>
      <span class="x"><a href="create.html?edit=${encodeURIComponent(p.id)}" style="color:var(--ink-2)">Edit →</a></span>
    </a></li>`).join('');
}

/* theme + tweaks */
const btnTheme = document.getElementById('btn-theme');
function themeIcon() {
  const dark = TWEAKS.theme === 'dark';
  btnTheme.innerHTML = dark
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>`
    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
}
btnTheme.onclick = () => setTweak('theme', TWEAKS.theme === 'light' ? 'dark' : 'light');
themeIcon();

const tweaksEl = document.getElementById('tweaks');
function setTweak(k, v) {
  TWEAKS[k] = v; document.body.setAttribute('data-' + k, v);
  localStorage.setItem('paper:tweaks', JSON.stringify(TWEAKS));
  document.querySelectorAll('.tweaks .opts').forEach(o => { const kk = o.dataset.k; o.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === TWEAKS[kk])); });
  themeIcon();
  try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]:v}}, '*'); } catch(e){}
}
document.querySelectorAll('.tweaks .opts button').forEach(b => b.onclick = () => setTweak(b.parentElement.dataset.k, b.dataset.v));
document.getElementById('tweaks-close').onclick = () => tweaksEl.classList.remove('open');
document.querySelectorAll('.tweaks .opts').forEach(o => { const k = o.dataset.k; o.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === TWEAKS[k])); });
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === '__activate_edit_mode') tweaksEl.classList.add('open');
  if (d.type === '__deactivate_edit_mode') tweaksEl.classList.remove('open');
});
try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(e){}

/* toast */
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1600); }

/* keyboard save */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); saveDraft(); markSaved(); toast('Draft saved'); }
});

syncFromState();
renderDrafts();
if (existing) markSaved('Editing published piece'); else if (loadDraft()) markSaved('Draft restored');
</script>
</body>
</html>
