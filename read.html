<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>paper — read</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="paper.css">
<style>
  .progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 50; transition: width .08s linear; }

  .wrap {
    max-width: 1240px; margin: 0 auto;
    padding: 60px 48px 160px;
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr) 200px;
    gap: 64px;
  }
  @media (max-width: 1000px) {
    .wrap { grid-template-columns: 1fr; gap: 0; padding: 32px 24px 120px; }
    .toc, .rail { display: none; }
  }

  .toc { position: sticky; top: 96px; align-self: start; }
  .toc h5 { margin: 0 0 14px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .toc a { display: block; padding: 8px 0; padding-left: 14px; margin-left: -14px; font-size: 14px; color: var(--ink-2); letter-spacing: -0.01em; border-left: 1px solid transparent; transition: all .25s ease; line-height: 1.35; }
  .toc a:hover { color: var(--ink); }
  .toc a.active { color: var(--ink); border-left-color: var(--accent); }

  .rail { position: sticky; top: 96px; align-self: start; font-size: 13px; color: var(--muted); letter-spacing: -0.005em; }
  .rail h5 { margin: 0 0 14px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .rail .tag { display: inline-block; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 999px; margin: 0 4px 6px 0; font-size: 12px; color: var(--ink-2); }
  .rail .stat { padding: 16px 0; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
  .rail .stat b { color: var(--ink); font-weight: 500; }
  .rail .share { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
  .rail .share button, .rail .share a { text-align: left; font-size: 13px; color: var(--ink-2); padding: 4px 0; }
  .rail .share button:hover, .rail .share a:hover { color: var(--ink); }

  .art { max-width: 680px; min-width: 0; }
  .art .kind {
    font-size: 12px; color: var(--muted); margin-bottom: 28px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .art .kind::before {
    content: ""; display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent); margin-right: 10px;
    vertical-align: middle; translate: 0 -1px;
  }
  .art h1 {
    margin: 0 0 28px;
    font-size: clamp(36px, 4.8vw, 60px);
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1.04;
    text-wrap: balance;
  }
  .art .deck {
    font-size: 22px; line-height: 1.45;
    color: var(--ink-2);
    letter-spacing: -0.012em;
    margin: 0 0 48px;
    font-weight: 400;
    max-width: 36ch;
    text-wrap: pretty;
  }
  .art .byline {
    display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
    padding: 20px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    font-size: 13px; color: var(--muted); letter-spacing: -0.005em;
    margin-bottom: 56px;
  }
  .art .byline b { color: var(--ink); font-weight: 500; }
  .art .byline .sep { color: var(--rule); }

  .prose { font-size: 18px; line-height: 1.7; color: var(--ink); letter-spacing: -0.005em; text-wrap: pretty; }
  .prose p { margin: 0 0 1.3em; }
  .prose p:first-of-type::first-letter {
    font-size: 3.4em; float: left; line-height: .9;
    padding: 4px 10px 0 0; font-weight: 300; letter-spacing: -0.04em;
    color: var(--ink);
  }
  .prose h2 {
    font-size: 26px; font-weight: 500; letter-spacing: -0.02em;
    margin: 72px 0 18px;
    line-height: 1.2;
    position: relative;
  }
  .prose h2::before {
    content: ""; position: absolute; left: -24px; top: .7em; width: 12px; height: 1px; background: var(--accent);
  }
  .prose blockquote {
    margin: 40px 0; padding: 0;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--ink);
    text-wrap: balance;
  }
  .prose blockquote::before { content: "“"; display: inline-block; color: var(--accent); font-size: 1.2em; line-height: 0; margin-right: 6px; vertical-align: -0.05em; }
  .prose strong { font-weight: 600; }

  .end {
    margin: 80px 0 0; padding: 40px 0 0;
    border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap;
    font-size: 14px; color: var(--muted);
  }
  .end a { color: var(--ink); border-bottom: 1px solid var(--rule); }
  .end a:hover { border-bottom-color: var(--ink); }

  .notfound { padding: 160px 0; text-align: center; color: var(--muted); }
  .notfound h2 { margin: 0 0 8px; color: var(--ink); font-weight: 400; font-size: 32px; letter-spacing: -0.02em; }
  .notfound a { color: var(--ink); border-bottom: 1px solid var(--rule); }

  .morelist { list-style: none; padding: 0; margin: 0; }
  .morelist li { border-bottom: 1px solid var(--rule); }
  .morelist a { display: grid; grid-template-columns: 1fr 80px; gap: 10px; padding: 14px 0; align-items: baseline; }
  .morelist .t { font-size: 15px; letter-spacing: -0.015em; color: var(--ink); line-height: 1.3; }
  .morelist .d { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .morelist a:hover .t { color: var(--accent); }

  .edit-link { color: var(--ink-2); font-size: 13px; }
  .edit-link:hover { color: var(--ink); }
</style>
</head>
<body data-theme="light" data-accent="ink">

<div class="progress" id="progress"></div>

<div class="shell">
  <nav class="top">
    <a href="index.html" class="brand"><span class="dot"></span>paper</a>
    <div class="links">
      <a href="index.html">Index</a>
      <a href="index.html#essays-col">Essays</a>
      <a href="index.html#articles-col">Articles</a>
    </div>
    <div class="actions">
      <button id="btn-theme" aria-label="Theme"></button>
      <a href="create.html" class="write">Write →</a>
    </div>
  </nav>
</div>

<div id="root"></div>

<div class="tweaks" id="tweaks">
  <h6>Tweaks <button class="x" id="tweaks-close">×</button></h6>
  <div class="row"><span>Theme</span><div class="opts" data-k="theme">
    <button data-v="light">Light</button><button data-v="dark">Dark</button>
  </div></div>
  <div class="row"><span>Accent</span><div class="opts" data-k="accent">
    <button data-v="ink">Ink</button><button data-v="warm">Warm</button>
  </div></div>
</div>

<div class="toast" id="toast">—</div>

<script src="data.js"></script>
<script>
/*EDITMODE-BEGIN*/const TWEAKS = {
  "theme": "light",
  "accent": "ink"
}/*EDITMODE-END*/;

try { const t = JSON.parse(localStorage.getItem('paper:tweaks')||'null'); if (t) Object.assign(TWEAKS, t); } catch(e){}
Object.entries(TWEAKS).forEach(([k,v]) => document.body.setAttribute('data-'+k, v));

const params = new URLSearchParams(location.search);
const id = params.get('id');
const post = id ? DB.get(id) : null;
const root = document.getElementById('root');

function escapeHtml(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

if (!post) {
  root.innerHTML = `<div class="shell"><div class="notfound"><h2>Nothing here.</h2><p>That piece doesn't exist (yet). <a href="index.html">Back to index</a> or <a href="create.html">write one</a>.</p></div></div>`;
} else {
  const { html, toc } = renderMarkdown(post.body);
  const more = DB.all().filter(p => p.id !== post.id && p.kind === post.kind).slice(0,5);
  const tags = (post.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
  const tocHtml = toc.length
    ? `<aside class="toc"><h5>Contents</h5>${toc.map((s,i) => `<a href="#${s.id}" class="${i===0?'active':''}">${escapeHtml(s.text)}</a>`).join('')}</aside>`
    : `<aside class="toc"></aside>`;

  root.innerHTML = `
    <main class="wrap">
      ${tocHtml}
      <article class="art">
        <div class="kind">${post.kind === 'essay' ? 'Essay' : 'Article'} · ${readTime(post.body)}</div>
        <h1>${escapeHtml(post.title)}</h1>
        ${post.deck ? `<p class="deck">${escapeHtml(post.deck)}</p>` : ''}
        <div class="byline">
          <span><b>${escapeHtml(post.author)}</b></span>
          <span class="sep">·</span>
          <span>${fmtDate(post.date)}</span>
          ${post.id.startsWith('seed-') ? '' : `<span class="sep">·</span><a class="edit-link" href="create.html?edit=${encodeURIComponent(post.id)}">Edit</a>`}
        </div>
        <div class="prose">${html}</div>

        <div class="end">
          <a href="index.html">← Back to index</a>
          ${post.id.startsWith('seed-') ? '' : `<button id="delete" style="color:var(--muted);border:0;background:none;cursor:pointer;font-size:14px;">Delete this ${post.kind}</button>`}
        </div>
      </article>
      <aside class="rail">
        <h5>${post.kind === 'essay' ? 'Essay' : 'Article'}</h5>
        <div>${tags || '<span style="color:var(--muted)">No tags</span>'}</div>
        <div class="stat"><span>Words</span><b>${(post.body||'').trim().split(/\s+/).length.toLocaleString()}</b></div>
        <div class="stat"><span>Read</span><b>${readTime(post.body)}</b></div>
        <div class="stat"><span>Published</span><b>${fmtDateDot(post.date)}</b></div>
        <div class="share">
          <h5 style="margin-top:6px">Share</h5>
          <button id="copylink">Copy link</button>
          <a href="index.html">Back to index</a>
        </div>
        ${more.length ? `<div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--rule)"><h5>More ${post.kind}s</h5><ul class="morelist">${more.map(p => `<li><a href="read.html?id=${encodeURIComponent(p.id)}"><span class="t">${escapeHtml(p.title)}</span><span class="d">${fmtDateDot(p.date)}</span></a></li>`).join('')}</ul></div>` : ''}
      </aside>
    </main>`;

  // scroll progress + active TOC
  const progress = document.getElementById('progress');
  const tocLinks = [...document.querySelectorAll('.toc a')];
  function onScroll() {
    const doc = document.documentElement;
    const max = doc.scrollHeight - doc.clientHeight;
    const pct = max <= 0 ? 0 : (window.scrollY / max) * 100;
    progress.style.width = pct + '%';
    if (toc.length) {
      let active = toc[0].id;
      for (const s of toc) {
        const el = document.getElementById(s.id);
        if (el && el.getBoundingClientRect().top < 180) active = s.id;
      }
      tocLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + active));
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  tocLinks.forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const el = document.getElementById(a.getAttribute('href').slice(1));
    if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
  }));

  const cl = document.getElementById('copylink');
  if (cl) cl.onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => toast('Link copied'));
  };
  const del = document.getElementById('delete');
  if (del) del.onclick = () => {
    if (confirm('Delete this ' + post.kind + '? This cannot be undone.')) {
      DB.remove(post.id);
      location.href = 'index.html';
    }
  };
}

/* theme */
const btnTheme = document.getElementById('btn-theme');
function themeIcon() {
  const dark = TWEAKS.theme === 'dark';
  btnTheme.innerHTML = dark
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>`
    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
}
btnTheme.onclick = () => setTweak('theme', TWEAKS.theme === 'light' ? 'dark' : 'light');
themeIcon();

/* tweaks */
const tweaksEl = document.getElementById('tweaks');
function setTweak(k, v) {
  TWEAKS[k] = v;
  document.body.setAttribute('data-' + k, v);
  localStorage.setItem('paper:tweaks', JSON.stringify(TWEAKS));
  document.querySelectorAll('.tweaks .opts').forEach(o => {
    const kk = o.dataset.k; o.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === TWEAKS[kk]));
  });
  themeIcon();
  try { window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]:v}}, '*'); } catch(e){}
}
document.querySelectorAll('.tweaks .opts button').forEach(b => b.onclick = () => setTweak(b.parentElement.dataset.k, b.dataset.v));
document.getElementById('tweaks-close').onclick = () => tweaksEl.classList.remove('open');
document.querySelectorAll('.tweaks .opts').forEach(o => { const k = o.dataset.k; o.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === TWEAKS[k])); });

window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === '__activate_edit_mode') tweaksEl.classList.add('open');
  if (d.type === '__deactivate_edit_mode') tweaksEl.classList.remove('open');
});
try { window.parent.postMessage({type:'__edit_mode_available'}, '*'); } catch(e){}

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1600); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') location.href = 'index.html';
});
</script>
</body>
</html>
